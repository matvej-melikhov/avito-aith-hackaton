[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "review-platform"
version = "0.1.0"
description = "Self-hosted review platform backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.16.5",
  "asyncmy==0.2.10",
  "authlib==1.6.3",
  "boto3==1.40.21",
  "fastapi==0.116.1",
  "greenlet==3.5.5",
  "mcp==1.13.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "redis==6.4.0",
  "rfc8785==0.1.4",
  "sqlalchemy==2.0.43",
  "taskiq==0.11.18",
  "taskiq-redis==1.1.0",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "anyio==4.15.0",
  "httpx==0.28.1",
  "jsonschema[format]==4.25.1",
  "mypy==1.17.1",
  "openapi-spec-validator==0.7.2",
  "pytest==8.4.1",
  "pyyaml==6.0.2",
  "ruff==0.12.11",
  "testcontainers[mysql,minio]==4.14.2",
  "types-jsonschema==4.26.0.20260518",
  "types-pyyaml==6.0.12.20250822",
]

[tool.hatch.build.targets.wheel]
packages = ["src/review_platform"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: requires an explicitly authorized external sandbox",
  "infrastructure: uses only local Docker/Testcontainers dependencies",
  "behavioral: executable specification expected to remain RED before Foundation implementation",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/review_platform", "tests/support"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true

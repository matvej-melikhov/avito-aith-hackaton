name: ${COMPOSE_PROJECT_NAME:-review-platform}

x-app-environment: &app-environment
  REVIEW_PLATFORM_ENVIRONMENT: ${REVIEW_PLATFORM_ENVIRONMENT:-local}
  REVIEW_PLATFORM_CONTRACT_VERSION: ${REVIEW_PLATFORM_CONTRACT_VERSION:-1.1.0}
  REVIEW_PLATFORM_LIVE_PROVIDERS_ENABLED: ${REVIEW_PLATFORM_LIVE_PROVIDERS_ENABLED:-false}
  REVIEW_PLATFORM_DATABASE_URL: ${REVIEW_PLATFORM_DATABASE_URL:-mysql+asyncmy://review_platform:local-dev-only@mysql:3306/review_platform}
  REVIEW_PLATFORM_REDIS_URL: ${REVIEW_PLATFORM_REDIS_URL:-redis://redis:6379/0}
  REVIEW_PLATFORM_S3_ENDPOINT_URL: ${REVIEW_PLATFORM_S3_ENDPOINT_URL:-http://minio:9000}
  REVIEW_PLATFORM_S3_BUCKET: ${REVIEW_PLATFORM_S3_BUCKET:-review-platform-local}
  REVIEW_PLATFORM_S3_REGION: ${REVIEW_PLATFORM_S3_REGION:-us-east-1}
  REVIEW_PLATFORM_S3_ACCESS_KEY_ID: ${REVIEW_PLATFORM_S3_ACCESS_KEY_ID:-localminio}
  REVIEW_PLATFORM_S3_SECRET_ACCESS_KEY: ${REVIEW_PLATFORM_S3_SECRET_ACCESS_KEY:-local-minio-only}
  REVIEW_PLATFORM_CREDENTIAL_ENCRYPTION_KEY_REF: ${REVIEW_PLATFORM_CREDENTIAL_ENCRYPTION_KEY_REF:-local-keyring:review-platform}
  REVIEW_PLATFORM_COMMAND_BODY_LIMIT_BYTES: ${REVIEW_PLATFORM_COMMAND_BODY_LIMIT_BYTES:-1048576}
  REVIEW_PLATFORM_PROVIDER_TIMEOUT_SECONDS: ${REVIEW_PLATFORM_PROVIDER_TIMEOUT_SECONDS:-15}
  REVIEW_PLATFORM_PROVIDER_MAX_ATTEMPTS: ${REVIEW_PLATFORM_PROVIDER_MAX_ATTEMPTS:-5}
  REVIEW_PLATFORM_RETRY_INITIAL_SECONDS: ${REVIEW_PLATFORM_RETRY_INITIAL_SECONDS:-60}
  REVIEW_PLATFORM_RETRY_MAX_SECONDS: ${REVIEW_PLATFORM_RETRY_MAX_SECONDS:-3600}
  REVIEW_PLATFORM_COURSE_IMPORT_CONCURRENCY: ${REVIEW_PLATFORM_COURSE_IMPORT_CONCURRENCY:-2}
  REVIEW_PLATFORM_AI_REVIEW_CONCURRENCY: ${REVIEW_PLATFORM_AI_REVIEW_CONCURRENCY:-10}
  REVIEW_PLATFORM_DELIVERY_CONCURRENCY: ${REVIEW_PLATFORM_DELIVERY_CONCURRENCY:-20}
  REVIEW_PLATFORM_GITHUB_MAX_FILES: ${REVIEW_PLATFORM_GITHUB_MAX_FILES:-10000}
  REVIEW_PLATFORM_SINGLE_BLOB_MAX_BYTES: ${REVIEW_PLATFORM_SINGLE_BLOB_MAX_BYTES:-10485760}
  REVIEW_PLATFORM_ARTIFACT_TOTAL_MAX_BYTES: ${REVIEW_PLATFORM_ARTIFACT_TOTAL_MAX_BYTES:-104857600}
  REVIEW_PLATFORM_ARCHIVE_MAX_BYTES: ${REVIEW_PLATFORM_ARCHIVE_MAX_BYTES:-104857600}
  REVIEW_PLATFORM_UNPACKED_MAX_BYTES: ${REVIEW_PLATFORM_UNPACKED_MAX_BYTES:-262144000}
  REVIEW_PLATFORM_GOOGLE_DOCX_MAX_BYTES: ${REVIEW_PLATFORM_GOOGLE_DOCX_MAX_BYTES:-10000000}
  REVIEW_PLATFORM_AI_SIGNED_URL_TTL_SECONDS: ${REVIEW_PLATFORM_AI_SIGNED_URL_TTL_SECONDS:-900}
  REVIEW_PLATFORM_ARTIFACT_BYTES_RETENTION_DAYS: ${REVIEW_PLATFORM_ARTIFACT_BYTES_RETENTION_DAYS:-90}
  REVIEW_PLATFORM_HISTORY_RETENTION_DAYS: ${REVIEW_PLATFORM_HISTORY_RETENTION_DAYS:-365}
  REVIEW_PLATFORM_OPERATION_RETENTION_DAYS: ${REVIEW_PLATFORM_OPERATION_RETENTION_DAYS:-90}
  REVIEW_PLATFORM_LOG_RETENTION_DAYS: ${REVIEW_PLATFORM_LOG_RETENTION_DAYS:-30}
  REVIEW_PLATFORM_STEPIK_SANDBOX_ENABLED: ${REVIEW_PLATFORM_STEPIK_SANDBOX_ENABLED:-false}
  REVIEW_PLATFORM_GITHUB_SANDBOX_ENABLED: ${REVIEW_PLATFORM_GITHUB_SANDBOX_ENABLED:-false}
  REVIEW_PLATFORM_GOOGLE_DOCS_SANDBOX_ENABLED: ${REVIEW_PLATFORM_GOOGLE_DOCS_SANDBOX_ENABLED:-false}
  REVIEW_PLATFORM_EMAIL_SANDBOX_ENABLED: ${REVIEW_PLATFORM_EMAIL_SANDBOX_ENABLED:-false}

x-app-base: &app-base
  restart: unless-stopped
  environment: *app-environment
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  networks: [backend]

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4.11}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-review_platform}
      MYSQL_USER: ${MYSQL_USER:-review_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-root-only}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [backend]

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.11-bookworm}
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-localminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-only}
    ports:
      - "127.0.0.1:${MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.31.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/livez >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    <<: *app-base
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: api
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app-base
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: worker
    healthcheck: &process-healthcheck
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  outbox-relay:
    <<: *app-base
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: outbox-relay
    healthcheck: *process-healthcheck

  email-worker:
    <<: *app-base
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: email-worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck: *process-healthcheck

  mcp:
    <<: *app-base
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: mcp
    ports:
      - "127.0.0.1:${MCP_PORT:-18001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
  minio-data:

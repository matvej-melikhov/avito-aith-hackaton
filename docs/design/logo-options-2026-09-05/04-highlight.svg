<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="2041" height="400" viewBox="28 49 2041 400"
     role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Avito Reviewer</title>
  <desc id="logo-desc">Чёрные квадратные скобки, голубая и фиолетовая кавычки, слово Reviewer на зелёной пилюле.</desc>

  <rect x="28" y="49" width="2041" height="400" fill="#FFFFFF"/>

  <!-- Знак -->
  <g id="mark" shape-rendering="geometricPrecision">
    <path d="M78 99H172V141H123V357H172V399H78Z" fill="#000000"/>
    <path d="M179 160H273V254C273 304 246 334 192 345V298C217 291 229 275 232 250H179Z"
          fill="#00AAFF"/>
    <path d="M294 158H391V254C391 305 363 336 307 347V299C333 292 346 275 349 249H294Z"
          fill="#965EEB"/>
    <path d="M393 99H487V399H393V357H442V141H393Z" fill="#000000"/>
  </g>

  <!-- Название. Onest — шрифт интерфейса; Arial используется как запасной. -->
  <text id="avito" x="565" y="317"
        fill="#000000"
        font-family="Onest, Arial, sans-serif"
        font-size="190" font-weight="700" letter-spacing="-8"
        textLength="464" lengthAdjust="spacingAndGlyphs">Avito</text>

  <rect id="reviewer-pill" x="1080" y="126" width="939" height="238" rx="119"
        fill="#04E061"/>
  <text id="reviewer" x="1167" y="315"
        fill="#000000"
        font-family="Onest, Arial, sans-serif"
        font-size="190" font-weight="700" letter-spacing="-8"
        textLength="780" lengthAdjust="spacingAndGlyphs">Reviewer</text>
</svg>

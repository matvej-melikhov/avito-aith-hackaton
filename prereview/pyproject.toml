[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "prereview"
version = "0.1.0"
description = "Ядро ИИ-проверки домашних работ: внешний AI-сервис для платформы ревью"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "openai>=1.100",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "httpx>=0.28",
  "pymupdf>=1.26",
  "openpyxl>=3.1",
  "certifi>=2025.1",
  "python-dotenv>=1.1",
  "typer>=0.16",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "jsonschema[format]>=4.25",
  "ruff>=0.12",
]

[project.scripts]
prereview = "prereview.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/prereview"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
